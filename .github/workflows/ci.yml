name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    name: Test & Validate Knowledge Base
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync

      - name: Run Test Suite
        run: uv run pytest -v

      - name: Validate Rules (Schema & Non-duplication)
        run: uv run kb validate --no-grounding

      - name: Verify Packs Compilation
        run: uv run kb compile --no-grounding
