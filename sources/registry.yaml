# Registre des sources de la Knowledge Base d'ingenierie
#
# Une seule question par entree : « comment obtenir le texte canonique, et a quel cout ? »
#
# method:
#   git       -> sparse-checkout du depot officiel. Cout 0. Donne le texte SOURCE
#                (markdown/rst/adoc) et un SHA git = provenance parfaite et diffable.
#   http      -> telechargement direct d'un document officiel (RFC, PDF NIST).  Cout 0.
#   feed      -> flux/dump structure officiel (CWE XML, CAPEC XML, NVD JSON).   Cout 0.
#   firecrawl -> RESERVE aux sources qui n'existent qu'en HTML rendu.  Cout 1 credit/page.
#                Budget : ~985 credits/mois. A depenser uniquement ici.
#   manual    -> acces restreint (inscription, licence). Ne pas automatiser.
#
# tier:
#   1 -> declenche des regles sur le code que Farel ecrit deja (stack reelle)
#   2 -> standards transverses + stack adjacente credible
#   3 -> ecosystemes qu'il ne livre pas aujourd'hui. Enregistres pour ne rien perdre,
#        acquis a la demande.
#
# redistribute: peut-on citer largement dans les packs livres ?
#   raw/ n'est de toute facon jamais commite (voir .gitignore) : c'est une archive
#   locale de verification. Ce drapeau borne la longueur des citations publiables.

meta:
  version: 1
  updated: "2026-07-28"
  credit_budget_note: >
    Firecrawl sert a DECOUVRIR (search/map), Python a RECUPERER (git/http/feed).
    Toute entree en method=firecrawl doit justifier pourquoi le texte canonique
    n'est pas accessible autrement.

sources:

  # ======================================================================= #
  # SECURITE — le coeur. Densite normative la plus elevee de tout le corpus.
  # ======================================================================= #

  - id: owasp-cheatsheets
    name: OWASP Cheat Sheet Series
    tier: 1
    method: git
    repo: OWASP/CheatSheetSeries
    ref: master
    paths: [cheatsheets]
    license: CC-BY-SA-4.0
    redistribute: true
    categories: [app-security, authentication, authorization, cryptography, api, frontend, backend]
    note: >
      120 fiches, chacune purement normative (« do this / never that »).
      Meilleur rendement regles/page du corpus entier. A traiter en premier.

  - id: owasp-asvs
    name: OWASP Application Security Verification Standard
    tier: 1
    method: git
    repo: OWASP/ASVS
    ref: master
    paths: ["5.0/en"]
    license: CC-BY-SA-4.0
    redistribute: true
    categories: [app-security, authentication, authorization, cryptography, data-protection]
    note: >
      Exigences numerotees et testables par construction — se transposent presque
      1:1 en regles. C'est le squelette de verification de la KB.

  - id: owasp-top10-web
    name: OWASP Top 10:2025 (web)
    tier: 1
    method: git
    repo: OWASP/Top10
    ref: master
    paths: ["2025"]
    license: NOASSERTION
    redistribute: false
    categories: [app-security]
    note: Taxonomie de reference pour le champ `owasp` des regles.

  - id: owasp-api-security
    name: OWASP API Security Top 10
    tier: 1
    method: git
    repo: OWASP/API-Security
    ref: master
    paths: ["editions/2023/en"]
    license: NOASSERTION
    redistribute: false
    categories: [api, authorization, app-security]

  - id: owasp-llm-top10
    name: OWASP Top 10 for LLM Applications
    tier: 1
    method: git
    repo: OWASP/www-project-top-10-for-large-language-model-applications
    ref: main
    paths: ["2_0_vulns/LLM*.md"]
    license: NOASSERTION
    redistribute: false
    categories: [ai-ml, app-security, data-protection]
    note: >
      L'exposition differenciante de Farel (Document Copilot, Cockpit, tout RAG).
      Aucun audit web classique ne couvre ce terrain.
      Chemin restreint aux 11 fichiers normatifs LLM00..LLM10 : un checkout complet
      du depot ramene 636 fichiers / 20 Mo d'echafaudage de site web (404.html,
      pre-commit, traductions, archives des versions candidates) pour ~110 Ko de
      contenu utile. Le bruit dilue l'extraction.

  - id: owasp-wstg
    name: OWASP Web Security Testing Guide
    tier: 1
    method: git
    repo: OWASP/wstg
    ref: master
    paths: [document]
    license: CC-BY-SA-4.0
    redistribute: true
    categories: [app-security, api, authentication, authorization]
    note: Fournit les conditions de detection (comment on prouve la faille).

  - id: openssf-best-practices
    name: OpenSSF — Best Practices for Open Source Developers
    tier: 1
    method: git
    repo: ossf/wg-best-practices-os-developers
    ref: main
    paths: [docs]
    license: Apache-2.0
    redistribute: true
    categories: [devops, code-quality, app-security]
    note: Chaine d'approvisionnement — OWASP A03:2025.

  - id: openssf-scorecard
    name: OpenSSF Scorecard — controles de securite des depots
    tier: 1
    method: git
    repo: ossf/scorecard
    ref: main
    paths: [docs]
    license: Apache-2.0
    redistribute: true
    categories: [devops, app-security]
    note: Controles deja mecanises — excellents patrons de `detection`.

  - id: cwe
    name: MITRE CWE — catalogue des faiblesses
    tier: 1
    method: feed
    urls: ["https://cwe.mitre.org/data/xml/cwec_latest.xml.zip"]
    format: xml-zip
    license: "MITRE terms of use"
    redistribute: false
    categories: [app-security]
    note: >
      Catalogue, pas guidance : a ingerer via le dump XML officiel, jamais en
      scrapant page par page. Alimente le champ `cwe` des regles.

  - id: capec
    name: MITRE CAPEC — patrons d'attaque
    tier: 2
    method: feed
    urls: ["https://capec.mitre.org/data/xml/capec_latest.xml"]
    format: xml
    license: "MITRE terms of use"
    redistribute: false
    categories: [app-security]
    note: Fournit les scenarios d'attaque exiges par le format Finding.

  - id: cvss
    name: CVSS v4.0 — specification
    tier: 2
    method: http
    urls: ["https://www.first.org/cvss/v4.0/specification-document"]
    license: "FIRST terms"
    redistribute: false
    categories: [app-security]
    note: Normalise le calcul de severite au lieu de la laisser au jugement du modele.

  - id: nvd-cve
    name: NVD / CVE — API officielle
    tier: 2
    method: feed
    urls: ["https://services.nvd.nist.gov/rest/json/cves/2.0"]
    format: json-api
    license: "public domain (NIST)"
    redistribute: false
    categories: [app-security, devops]
    note: >
      Donnee vivante, pas une regle. A interroger au moment de l'audit des
      dependances, pas a figer dans un pack.

  - id: nist-crypto
    name: NIST — publications cryptographiques (SP 800-*)
    tier: 1
    method: http
    urls:
      - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-175Br1.pdf"
      - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-63B-4.pdf"
      - "https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-131Ar2.pdf"
    license: "public domain (NIST)"
    redistribute: true
    categories: [cryptography, authentication]
    note: >
      SP 800-63B = l'autorite sur les mots de passe et l'AAL. Revision 4 retenue
      (la rev. 3 renverse les vieilles regles : plus de rotation obligatoire, plus
      de complexite imposee — une KB sur la rev. 3 conseillerait l'inverse de
      l'etat de l'art). 800-131A : la r3 n'existe pas, la revision courante est r2.

  - id: nist-ssdf
    name: NIST SSDF — Secure Software Development Framework (SP 800-218)
    tier: 2
    method: http
    urls: ["https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-218.pdf"]
    license: "public domain (NIST)"
    redistribute: true
    categories: [devops, architecture, code-quality]

  - id: cert-secure-coding
    name: SEI CERT — Secure Coding Standards
    tier: 2
    method: firecrawl
    discover: "wiki.sei.cmu.edu SEI CERT secure coding standard C Java Perl"
    license: "CMU terms"
    redistribute: false
    categories: [code-quality, app-security]
    note: Wiki Confluence — pas de source texte publique, Firecrawl justifie.

  - id: portswigger-academy
    name: PortSwigger Web Security Academy
    tier: 2
