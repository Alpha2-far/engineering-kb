    discover: "portswigger.net/web-security all topics list"
    license: "PortSwigger terms — verifier avant toute rediffusion"
    redistribute: false
    categories: [app-security, api, authentication, authorization]
    note: >
      Meilleure source d'exemples d'exploitation reels. HTML uniquement -> Firecrawl.
      Verifier les CGU : usage interne d'extraction de regles, pas de miroir public.

  - id: mozilla-security
    name: Mozilla / MDN — Web Security
    tier: 1
    method: git
    repo: mdn/content
    ref: main
    paths: ["files/en-us/web/security", "files/en-us/web/http/headers"]
    license: CC-BY-SA-2.5
    redistribute: true
    categories: [frontend, network, app-security]
    note: Source canonique des headers de securite et de CSP.

  - id: cis-benchmarks
    name: CIS Benchmarks
    tier: 3
    method: manual
    license: "CIS — inscription requise, licence restrictive"
    redistribute: false
    categories: [devops, cloud, production-readiness]
    note: >
      NE PAS automatiser : telechargement sous inscription et licence restrictive.
      Deliberement laisse en manuel — un miroir automatise nous mettrait en faute.

  - id: cloudflare-docs
    name: Cloudflare — WAF, bots, DDoS, Zero Trust
    tier: 1
