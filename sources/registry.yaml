  - id: gdpr
    name: RGPD — texte officiel (JO L 119/1)
    tier: 1
    method: firecrawl
    urls: ["https://eur-lex.europa.eu/legal-content/FR/TXT/HTML/?uri=CELEX:32016R0679"]
    license: "EUR-Lex reuse"
    redistribute: true
    categories: [compliance, data-protection]
    note: >
      Art. 25 et 32 = les seuls articles reellement traduisibles en regles de code.
      EUR-Lex repond HTTP 200 avec un corps VIDE a toute requete directe (contenu
      rendu cote client) : verifie sur 4 variantes d'URL, HTML et PDF, FR et EN.
      Firecrawl est donc le seul acces au texte officiel — 1 credit, 432 Ko.
      Ecarte volontairement : gdpr-info.eu repond bien mais c'est un miroir non
      officiel ; citer un miroir pour un texte de loi ne tient pas devant un client
      qui achete de la conformite.

