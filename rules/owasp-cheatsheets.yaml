  - id: app-security/file-upload/extension-and-type-not-validated
    title: Valider extension et type reel d'un fichier televerse, et le renommer
    category: app-security
    subcategory: file-upload
    severity: high
    confidence: high
    description: >-
      Un fichier televerse doit etre accepte sur liste d'extensions autorisees,
      voir son type reel controle sans se fier a l'en-tete Content-Type, etre
      renomme par l'application, et etre stocke hors de la racine web.
    rationale: >-
      L'extension et le Content-Type sont fournis par le client : les deux se
      falsifient trivialement. Un fichier accepte sur sa seule extension declaree,
      conserve sous le nom choisi par l'appelant et depose dans un repertoire servi
      par le serveur web, permet de deposer puis d'invoquer du code. La double
      extension et l'octet nul contournent en outre les filtres naifs.
    remediation: >-
      Autoriser explicitement les seules extensions utiles au metier, verifier la
      signature reelle du contenu, generer un nom aleatoire cote application, et
      servir les fichiers par un gestionnaire qui fait correspondre un identifiant
      au fichier plutot que d'exposer le chemin.
    context:
      languages: [python, typescript]
      frameworks: [fastapi, next, express]
      project_types: [saas, api, ai-rag]
    detection:
      - kind: grep
        pattern: '(?i)\.(filename|originalname|content_type|mimetype)\b'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: >-
          Metadonnee de televersement fournie par le client. Verifier qu'elle ne
          sert pas de controle de securite ni de nom de fichier final.
      - kind: absent
        pattern: '(?i)(ALLOWED_EXTENSIONS|allowed_types|allowlist|uuid4|token_hex|randomUUID|magic|filetype|imghdr)'
        applies_to: ['**/upload*/**', '**/*upload*.py', '**/*upload*.ts']
        note: >-
          Chemin de televersement sans liste d'autorisation ni nom genere.
    autofix: never
    vulnerable_example:
      lang: python
      code: |
        chemin = Path("static/uploads") / fichier.filename    # nom choisi par le client
        chemin.write_bytes(await fichier.read())
      explanation: >-
        facture.pdf.php depose dans un repertoire servi devient executable ; ../ dans
        le nom sort du repertoire.
    fixed_example:
      lang: python
      code: |
        EXT_AUTORISEES = {".pdf", ".docx"}

        ext = Path(fichier.filename).suffix.lower()
        if ext not in EXT_AUTORISEES:
            raise HTTPException(415, "type de fichier non autorise")

        contenu = await fichier.read()
        if filetype.guess(contenu).mime not in {"application/pdf", DOCX_MIME}:
            raise HTTPException(415, "le contenu ne correspond pas a l'extension")

        # Nom genere, stockage hors racine web, service par identifiant.
        chemin = STOCKAGE_PRIVE / f"{uuid4().hex}{ext}"
        chemin.write_bytes(contenu)
      explanation: >-
        Extension sur liste, type reel verifie, nom maitrise, fichier non servi
        directement.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/File_Upload_Cheat_Sheet.md
        doc_sha256: 0f527b1636adb44e305c97657b5cf84c0b5b60895ee5091f4b26baee0e271b6d
        anchor: Overview
        url: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        quote: |-
          Validate the file type, don't trust the [Content-Type header](https://developer.mozilla.org/en-US/docs/Web/HTTP/Headers/Content-Type) as it can be spoofed
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/File_Upload_Cheat_Sheet.md
        doc_sha256: 0f527b1636adb44e305c97657b5cf84c0b5b60895ee5091f4b26baee0e271b6d
        anchor: Extension Validation
        url: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        quote: |-
          Double extensions, _e.g._ `.jpg.php`, where it circumvents easily the regex `\.jpg`
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/File_Upload_Cheat_Sheet.md
        doc_sha256: 0f527b1636adb44e305c97657b5cf84c0b5b60895ee5091f4b26baee0e271b6d
        anchor: Filename Sanitization
        url: https://cheatsheetseries.owasp.org/cheatsheets/File_Upload_Cheat_Sheet.html
        quote: |-
          creating a **random string** as a filename, such as generating a UUID/GUID, is essential.
