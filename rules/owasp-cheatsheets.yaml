source_id: owasp-cheatsheets

# Regles tirees des OWASP Cheat Sheets. Perimetre : les fiches qui portent sur
# la pile reellement en service (Python/FastAPI, TypeScript/React/Next, Postgres,
# Docker, GitHub Actions) et sur les defauts qui se lisent dans le code. Les
# fiches propres a Java, .NET, PHP, Rails, Kubernetes ou l'embarque ne sont pas
# extraites : elles ne se declencheraient sur aucun projet ici.

rules:
  - id: database/sql-injection/dynamic-query-string-concatenation
    title: Parametrer les requetes SQL au lieu de concatener les entrees
    category: database
    subcategory: sql-injection
    severity: critical
    confidence: high
    description: >-
      Toute requete SQL doit etre construite avec des parametres lies : le code SQL
      est defini d'abord, les valeurs sont passees ensuite. Aucune donnee externe ne
      doit etre inseree par concatenation, f-string ou formatage de chaine.
    rationale: >-
      Une requete construite par concatenation ne distingue plus le code de la
      donnee : le moteur recoit une seule chaine et l'analyse entierement comme du
      SQL. Une valeur contenant une apostrophe referme la chaine litterale et le
      reste de l'entree devient de la syntaxe executable, avec les droits de la
      connexion applicative. Le parametrage supprime la classe entiere de defauts
      plutot que de filtrer ses manifestations.
    remediation: >-
      Utiliser des instructions preparees ou des requetes parametrees partout.
      Quand c'est la structure de la requete qui varie (nom de colonne, sens du
      tri), valider la valeur contre une liste d'autorisation explicite : le
      parametrage ne couvre que les valeurs, pas les identifiants.
    context:
      languages: [python, typescript, sql]
      frameworks: [sqlalchemy, fastapi, prisma]
      platforms: [postgresql, supabase]
      project_types: [saas, api, ai-rag, pipeline, cli]
    detection:
      - kind: grep
        pattern: '(?i)(execute|executemany|raw|query|text)\s*\(\s*f["'']'
        applies_to: ['**/*.py']
        note: Requete construite par f-string.
      - kind: grep
        pattern: '(?i)(select|insert\s+into|update|delete\s+from)\s[^;''"]{0,200}["'']\s*[%+]\s*\w'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: Concatenation ou interpolation dans une requete SQL.
      - kind: grep
        pattern: '\$queryRawUnsafe|\$executeRawUnsafe'
        applies_to: ['**/*.ts', '**/*.js']
        note: Variante Prisma explicitement non securisee.
    autofix: review
    vulnerable_example:
      lang: python
      code: |
        nom = request.query_params["client"]
        rows = session.execute(text(f"select * from dossiers where client = '{nom}'"))
      explanation: >-
        L'entree ' or '1'='1 transforme le filtre en condition toujours vraie.
    fixed_example:
      lang: python
      code: |
        nom = request.query_params["client"]
        rows = session.execute(
            text("select * from dossiers where client = :client"),
            {"client": nom},
        )
      explanation: >-
        Le SQL est fige avant que la valeur n'arrive ; elle ne peut plus en changer
        le sens.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md
        doc_sha256: 77924b56a036b072bbc7a2b3bfc4f9f59fa5da92790c6690681574cb9457ec14
        anchor: Defense Option 1 / Prepared Statements
        url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
        quote: |-
          parameterized queries force the developer to define all SQL code first and pass in each parameter to the query later.
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.md
        doc_sha256: 77924b56a036b072bbc7a2b3bfc4f9f59fa5da92790c6690681574cb9457ec14
        anchor: What Is a SQL Injection Attack?
        url: https://cheatsheetseries.owasp.org/cheatsheets/SQL_Injection_Prevention_Cheat_Sheet.html
        quote: |-
          Attackers can use SQL injection on an application if it has dynamic database queries that use string concatenation and user-supplied input.
    tags: [injection-sql, base-de-donnees, validation]
    cwe: ['CWE-89']
    owasp: ['A03:2021']
    extracted_at: '2026-08-01'
    extractor: claude-opus-5

  - id: authentication/password-storage/fast-hash-used-for-passwords
    title: Hacher les mots de passe avec Argon2id, scrypt, bcrypt ou PBKDF2
    category: authentication
    subcategory: password-storage
    severity: critical
    confidence: high
    description: >-
      Un mot de passe doit etre hache avec un algorithme lent et parametrable
      (Argon2id en premier choix, sinon scrypt, bcrypt ou PBKDF2), avec un sel
      unique par mot de passe. Ni stockage en clair, ni chiffrement reversible, ni
      fonction de hachage rapide de la famille SHA ou MD5.
    rationale: >-
      SHA-256 est concu pour etre rapide : c'est exactement la propriete que
      l'attaquant exploite, en essayant des milliards de candidats a la seconde sur
      un GPU. Un algorithme lent et gourmand en memoire rend chaque essai couteux,
      et le sel unique interdit d'attaquer toute la base d'un seul calcul. Le
      chiffrement est exclu parce qu'il est reversible : la cle compromise rend tous
      les mots de passe en clair.
    remediation: >-
      Utiliser Argon2id avec au minimum 19 MiB de memoire, 2 iterations et 1 degre
      de parallelisme ; bcrypt avec un facteur de travail d'au moins 10 pour un
      systeme existant. Passer par la bibliotheque du framework, qui gere le sel, et
      rehacher au moment de la connexion quand les parametres evoluent.
    context:
      languages: [python, typescript]
      project_types: [saas, api]
    detection:
      - kind: grep
        pattern: '(?i)(hashlib\.(md5|sha1|sha256|sha512)|createHash\s*\(\s*["''](md5|sha1|sha256)["''])'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: >-
          Hachage rapide. A signaler si la valeur hachee est un mot de passe.
      - kind: grep
        pattern: '(?i)(password|mot_de_passe|passwd)\s*=\s*[^=\n]{0,40}(md5|sha1|sha256|sha512|encrypt|cipher)\s*\('
        applies_to: ['**/*.py', '**/*.ts']
      - kind: absent
        pattern: '(?i)(argon2|bcrypt|scrypt|pbkdf2|passlib|CryptContext)'
        applies_to: ['**/auth/**/*.py', '**/*password*.py', '**/*auth*.py']
        note: >-
          Module d'authentification sans aucune fonction de hachage adaptee.
    autofix: never
    vulnerable_example:
      lang: python
      code: |
        empreinte = hashlib.sha256(mot_de_passe.encode()).hexdigest()
        db.save(User(email=email, password_hash=empreinte))
      explanation: >-
        Rapide et sans sel : une fuite de base se casse au dictionnaire en quelques
        heures.
    fixed_example:
      lang: python
      code: |
        from argon2 import PasswordHasher

        ph = PasswordHasher(memory_cost=19456, time_cost=2, parallelism=1)
        db.save(User(email=email, password_hash=ph.hash(mot_de_passe)))
      explanation: >-
        Sel genere par la bibliotheque, cout memoire impose a chaque essai.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Password_Storage_Cheat_Sheet.md
        doc_sha256: 59e6ce03452bb2607e690010487389db388af969d43ce6acb535a3e2f128e14e
        anchor: Introduction
        url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        quote: |-
          Passwords should never be stored in plain text. Instead, they must be protected using strong, slow hashing algorithms such as Argon2id, bcrypt, or PBKDF2. A unique salt must be added to each password to prevent attackers from using precomputed lookup tables like rainbow tables.
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Password_Storage_Cheat_Sheet.md
        doc_sha256: 59e6ce03452bb2607e690010487389db388af969d43ce6acb535a3e2f128e14e
        anchor: Methods for Enhancing Password Storage / Salting
        url: https://cheatsheetseries.owasp.org/cheatsheets/Password_Storage_Cheat_Sheet.html
        quote: |-
          A salt is a unique, randomly generated string that is added to each password as part of the hashing process.
    tags: [mots-de-passe, hachage, argon2, cryptographie]
    cwe: ['CWE-916', 'CWE-759']
    owasp: ['A02:2021']
    extracted_at: '2026-08-01'
    extractor: claude-opus-5

  - id: authentication/jwt/algorithm-not-pinned-at-verification
    title: Imposer l'algorithme attendu a la verification d'un JWT
    category: authentication
    subcategory: jwt
    severity: critical
    confidence: high
    description: >-
      La verification d'un JWT doit exiger explicitement l'algorithme attendu, au
      lieu de se fier a l'en-tete alg du jeton presente.
    rationale: >-
      L'en-tete du jeton est fourni par celui qui le presente : lui laisser choisir
      l'algorithme revient a laisser l'attaquant choisir comment sa signature sera
      verifiee. La valeur none a fait accepter des jetons non signes par plusieurs
      bibliotheques, et un basculement de RS256 vers HS256 permet de signer avec la
      cle publique, qui est publique par construction. Le controle doit venir du
      code du verificateur, pas du jeton.
    remediation: >-
      Passer la liste des algorithmes acceptes a la fonction de verification et
      refuser tout le reste, y compris none. Verifier egalement les revendications
      d'emetteur et d'audience, qu'une signature valide ne garantit pas.
    context:
      languages: [python, typescript]
      frameworks: [fastapi, next, express]
      project_types: [saas, api, ai-rag]
    detection:
      - kind: grep
        pattern: '(?i)jwt\.decode\s*\([^)]*verify_signature\s*:\s*False|jwt\.decode\s*\([^)]*options\s*=\s*\{[^}]*verify[^}]*False'
        applies_to: ['**/*.py']
        note: Verification de signature desactivee.
      - kind: grep
        pattern: '(?i)(jwt\.decode|jwtVerify|verify)\s*\(\s*\w+\s*,\s*\w+\s*\)'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: >-
          Verification sans argument algorithms : l'en-tete du jeton decide.
      - kind: grep
        pattern: '(?i)["'']alg["'']\s*:\s*["'']none["'']|algorithms\s*=\s*\[[^\]]*none'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
    autofix: review
    vulnerable_example:
      lang: python
      code: |
        payload = jwt.decode(token, SECRET)     # l'algorithme vient du jeton
      explanation: >-
        Un jeton forge avec alg none ou HS256 peut passer selon la bibliotheque.
    fixed_example:
      lang: python
      code: |
        payload = jwt.decode(
            token,
            SECRET,
            algorithms=["HS256"],          # impose par le code
            audience=SETTINGS.audience,
            issuer=SETTINGS.issuer,
        )
      explanation: >-
        Tout jeton annoncant un autre algorithme est rejete avant lecture des claims.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/JSON_Web_Token_Cheat_Sheet.md
        doc_sha256: b465e68c80973b8e4e502bbef2642cf026ecdeade84cec50defa5878e08d34df
        anchor: Issues / None Hashing Algorithm
        url: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html
        quote: |-
          some libraries treated tokens signed with the none algorithm as a valid token with a verified signature
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/JSON_Web_Token_Cheat_Sheet.md
        doc_sha256: b465e68c80973b8e4e502bbef2642cf026ecdeade84cec50defa5878e08d34df
        anchor: Issues / None Hashing Algorithm / How to Prevent
        url: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html
        quote: |-
          Last, during token validation, explicitly request that the expected algorithm was used.
    tags: [jwt, authentification, signature]
    cwe: ['CWE-347']
    owasp: ['A02:2021', 'A07:2021']
    extracted_at: '2026-08-01'
    extractor: claude-opus-5

  - id: authentication/jwt/hmac-secret-too-short
    title: Utiliser un secret HMAC long et aleatoire pour signer les JWT
    category: authentication
    subcategory: jwt
    severity: high
    confidence: high
    description: >-
      Le secret utilise pour signer un JWT en HMAC doit compter au moins
      64 caracteres issus d'une source d'alea sure, etre unique par environnement,
      et ne jamais figurer dans le code ni avoir de valeur de repli.
    rationale: >-
      La securite d'un jeton HMAC ne depend de rien d'autre que de la force du
      secret. Un attaquant qui detient un jeton valide peut attaquer le secret hors
      ligne, sans limite de debit et sans laisser de trace ; une phrase courte ou un
      mot du dictionnaire tombe en quelques minutes. Le secret casse, il peut
      forger n'importe quelle identite, y compris administrateur.
    remediation: >-
      Generer le secret avec un generateur cryptographique, le stocker dans la
      configuration d'environnement, et faire echouer le demarrage s'il est absent
      plutot que de retomber sur une valeur par defaut. Envisager une signature
      asymetrique quand plusieurs services verifient les jetons.
    context:
      languages: [python, typescript]
      project_types: [saas, api, ai-rag]
    detection:
      - kind: grep
        pattern: '(?i)(jwt_secret|secret_key|JWT_SECRET|SECRET_KEY)\s*[:=]\s*["''][^"'']{0,63}["'']'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js', '**/*.env*']
        note: Secret litteral de moins de 64 caracteres.
      - kind: grep
        pattern: '(?i)(getenv|environ\.get|process\.env\.\w*SECRET\w*)[^)\n]{0,60}(,\s*["''][^"'']+["'']|\|\|\s*["''])'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: >-
          Valeur de repli sur un secret : l'environnement mal configure demarre avec
          un secret connu.
    autofix: never
    vulnerable_example:
      lang: python
      code: |
        SECRET = os.getenv("JWT_SECRET", "dev-secret")   # repli en production
      explanation: >-
        Une variable oubliee au deploiement fait signer les jetons avec une valeur
        presente dans le depot.
    fixed_example:
      lang: python
      code: |
        SECRET = os.environ["JWT_SECRET"]       # KeyError au demarrage si absent
        if len(SECRET) < 64:
            raise RuntimeError("JWT_SECRET doit faire au moins 64 caracteres")
      explanation: >-
        L'application refuse de demarrer mal configuree, au lieu de demarrer
        vulnerable.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/JSON_Web_Token_Cheat_Sheet.md
        doc_sha256: b465e68c80973b8e4e502bbef2642cf026ecdeade84cec50defa5878e08d34df
        anchor: Issues / Weak Token Secret / How to Prevent
        url: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html
        quote: |-
          As this secret would never need to be typed by a human, it should be at least 64 characters, and generated using a
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/JSON_Web_Token_Cheat_Sheet.md
        doc_sha256: b465e68c80973b8e4e502bbef2642cf026ecdeade84cec50defa5878e08d34df
        anchor: Issues / Weak Token Secret / Symptom
        url: https://cheatsheetseries.owasp.org/cheatsheets/JSON_Web_Token_Cheat_Sheet.html
        quote: |-
          the security of the token is entirely dependent on the strength of the secret used with the HMAC. If an attacker can obtain a valid JWT, they can then carry out an offline attack
    tags: [jwt, secrets, cryptographie]
    cwe: ['CWE-326', 'CWE-798']
    owasp: ['A02:2021']
    extracted_at: '2026-08-01'
    extractor: claude-opus-5

  - id: authorization/object-level/missing-ownership-check-on-id
    title: Verifier la propriete de l'objet a chaque acces par identifiant
    category: authorization
    subcategory: object-level
    severity: critical
    confidence: high
    description: >-
      Toute route qui recoit un identifiant d'objet doit verifier, cote serveur, que
      l'utilisateur authentifie a le droit d'acceder a cet objet precis, avant de le
      lire ou de le modifier.
    rationale: >-
      Etre authentifie ne dit rien sur ce a quoi on a droit. Sans controle au niveau
      de l'objet, changer un chiffre dans l'URL suffit a lire le dossier d'un autre
      client : l'attaque ne demande aucun outil et laisse des traces indistinguables
      d'un usage normal. Un identifiant difficile a deviner ne remplace pas le
      controle : une URL partagee ou un journal fuite suffit a l'obtenir.
    remediation: >-
      Charger l'objet avec un predicat de propriete dans la requete meme, plutot que
      de le charger puis de comparer. Sur Postgres, doubler d'une policy Row Level
      Security pour que l'oubli d'un filtre ne suffise pas a ouvrir l'acces.
    context:
      languages: [python, typescript]
      frameworks: [fastapi, next, express]
      platforms: [supabase, postgresql]
      project_types: [saas, api, ai-rag]
    detection:
      - kind: grep
        pattern: '(?i)\{\s*(id|uuid|\w+_id)\s*(:[^}]*)?\}'
        applies_to: ['**/routers/**/*.py', '**/api/**/*.py', '**/app/api/**/route.ts']
        note: >-
          Route parametree par un identifiant. Verifier qu'un filtre de propriete
          accompagne le chargement.
      - kind: grep
        pattern: '(?i)\.(get|filter_by|find_one|findUnique|findFirst)\s*\(\s*(id\s*=|\{\s*id\s*:)'
        applies_to: ['**/*.py', '**/*.ts']
        note: >-
          Chargement par identifiant seul, sans predicat d'appartenance.
    autofix: never
    vulnerable_example:
      lang: python
      code: |
        @router.get("/dossiers/{dossier_id}")
        async def lire(dossier_id: str, user: User = Depends(current_user)):
            return await Dossier.get(id=dossier_id)      # aucun lien avec user
      explanation: >-
        Incrementer dossier_id donne acces aux dossiers des autres cabinets.
    fixed_example:
      lang: python
      code: |
        @router.get("/dossiers/{dossier_id}")
        async def lire(dossier_id: str, user: User = Depends(current_user)):
            dossier = await Dossier.get(id=dossier_id, org_id=user.org_id)
            if dossier is None:
                raise HTTPException(404)     # 404, pas 403 : ne pas confirmer l'existence
            return dossier
      explanation: >-
        Le predicat d'appartenance est dans la requete ; la reponse ne revele pas
        l'existence d'un objet inaccessible.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.md
        doc_sha256: 0a0056b89acc452b4e4fece79511387406480e912f4fce8247b1381446fc4bda
        anchor: Introduction
        url: https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
        quote: |-
          A missing object-level authorization check that allows a user to access or manipulate an object they should not be able to access.
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.md
        doc_sha256: 0a0056b89acc452b4e4fece79511387406480e912f4fce8247b1381446fc4bda
        anchor: Identifier complexity
        url: https://cheatsheetseries.owasp.org/cheatsheets/Insecure_Direct_Object_Reference_Prevention_Cheat_Sheet.html
        quote: |-
          However, even with complex identifiers, access control checks are essential. If attackers obtain URLs for unauthorized objects, the application should still block their access attempts.
    tags: [idor, autorisation, multi-tenant, api]
    cwe: ['CWE-639']
    owasp: ['A01:2021', 'API1:2023']
    extracted_at: '2026-08-01'
    extractor: claude-opus-5

  - id: authorization/multi-tenant/tenant-id-taken-from-request
    title: Deriver le locataire de la session authentifiee, jamais de la requete
    category: authorization
    subcategory: multi-tenant
    severity: critical
    confidence: high
    description: >-
      L'identifiant de locataire qui sert a filtrer les donnees doit etre lu dans la
      session ou le jeton verifie, jamais dans un en-tete, un parametre de requete
      ou un champ du corps fourni par le client.
    rationale: >-
      Un identifiant de locataire transmis par le client est une valeur que le
      client controle : le modifier suffit a basculer tout le filtrage vers un autre
      cabinet. Le controle d'acces devient alors declaratif, exactement comme si on
      demandait poliment a l'appelant de ne pas tricher. Le seul identifiant
      opposable est celui qui a ete etabli a l'authentification et signe.
    remediation: >-
      Etablir le contexte de locataire tot dans le cycle de requete, a partir de la
      session, et l'injecter dans la couche d'acces aux donnees. Si un en-tete de
      locataire existe pour des raisons de routage, verifier qu'il correspond a
      celui de la session et refuser sinon.
    context:
      languages: [python, typescript]
      frameworks: [fastapi, next, express]
      platforms: [supabase, postgresql]
      project_types: [saas, api, ai-rag]
    detection:
      - kind: grep
        pattern: '(?i)(headers|query_params|args|params|body|cookies)[\.\[]\s*["'']?[xX]?-?(tenant|org|organisation|organization|account|workspace)[_-]?id'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: >-
          Identifiant de locataire lu depuis une entree client.
    autofix: never
    vulnerable_example:
      lang: python
      code: |
        def get_tenant_data(request):
            tenant_id = request.headers.get("X-Tenant-ID")   # controle par l'appelant
            return db.execute("select * from data where tenant_id = :t", {"t": tenant_id})
      explanation: >-
        Changer un en-tete donne acces aux donnees de n'importe quel locataire.
    fixed_example:
      lang: python
      code: |
        def get_tenant_data(request, user: User = Depends(current_user)):
            # Le locataire vient du jeton verifie, pas de la requete.
            return db.execute(
                "select * from data where tenant_id = :t",
                {"t": user.tenant_id},
            )
      explanation: >-
        L'appelant ne peut plus choisir son perimetre : il est fixe a
        l'authentification.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.md
        doc_sha256: 8faca80517276ada9574c0f92b714e949d5ae5ea0f180ce2f92dd86c69df548b
        anchor: Tenant Identification & Context Management
        url: https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html
        quote: |-
          Establish tenant context early in the request lifecycle (middleware/interceptor).
          - Use cryptographically secure, non-guessable tenant identifiers.
          - Never trust client-supplied tenant IDs without validation.
          - Bind tenant context to the authenticated user session.
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.md
        doc_sha256: 8faca80517276ada9574c0f92b714e949d5ae5ea0f180ce2f92dd86c69df548b
        anchor: Bad example / Trusting client-supplied tenant ID
        url: https://cheatsheetseries.owasp.org/cheatsheets/Multi_Tenant_Security_Cheat_Sheet.html
        quote: |-
          # Dangerous: Tenant ID from request header without validation/query parameterization
    tags: [multi-tenant, autorisation, isolation, saas]
