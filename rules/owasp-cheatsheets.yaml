  - id: api/mass-assignment/request-body-bound-to-model
    title: Ne pas lier directement le corps de requete au modele persiste
    category: api
    subcategory: mass-assignment
    severity: high
    confidence: high
    description: >-
      Le corps d'une requete ne doit pas etre affecte en bloc a l'objet persiste :
      la couche d'entree declare explicitement les champs modifiables, et les
      attributs sensibles n'y figurent pas.
    rationale: >-
      La liaison automatique cree des parametres que le developpeur n'a jamais
      prevus : il suffit d'ajouter un champ au corps JSON pour ecrire un attribut
      qui n'apparait dans aucun formulaire. C'est ainsi qu'un utilisateur se donne
      un role d'administrateur, change le proprietaire d'un objet ou remet a zero un
      compteur de facturation, sans qu'aucune route dediee n'existe.
    remediation: >-
      Definir un schema d'entree ne contenant que les champs que le client a le
      droit d'ecrire, refuser les champs inconnus, et recopier explicitement vers le
      modele. Ne jamais construire l'entite a partir du dictionnaire brut de la
      requete.
    context:
      languages: [python, typescript]
      frameworks: [fastapi, pydantic, prisma, express]
      project_types: [saas, api, ai-rag]
    detection:
      - kind: grep
        pattern: '(?i)(Model|User|Account|Order|Dossier|\w+)\s*\(\s*\*\*\s*(request|payload|body|data|dto)\b'
        applies_to: ['**/*.py']
        note: Deballage du corps de requete dans le constructeur du modele.
      - kind: grep
        pattern: '(?i)(setattr\s*\(|Object\.assign\s*\(|\.\.\.\s*(req\.body|body|payload)\b)'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: Affectation en bloc depuis le corps de requete.
      - kind: grep
        pattern: '(?i)model_config\s*=\s*ConfigDict\((?![^)]*extra)'
        applies_to: ['**/schemas/**/*.py', '**/*schema*.py']
        note: >-
          Schema d'entree sans politique explicite sur les champs supplementaires.
    autofix: review
    vulnerable_example:
      lang: python
      code: |
        @router.post("/users")
        async def creer(payload: dict):
            return await User.create(**payload)     # is_admin passe si le client l'envoie
      explanation: >-
        Ajouter "is_admin": true au JSON suffit a obtenir le role.
    fixed_example:
      lang: python
      code: |
        class UserCreate(BaseModel):
            model_config = ConfigDict(extra="forbid")   # champ inconnu = 422
            email: EmailStr
            nom: str
            # is_admin n'est pas exposé : il n'est pas ecrivable par le client.

        @router.post("/users")
        async def creer(payload: UserCreate):
            return await User.create(email=payload.email, nom=payload.nom)
      explanation: >-
        La surface ecrivable est declaree, et tout champ hors liste est rejete.
    evidence:
