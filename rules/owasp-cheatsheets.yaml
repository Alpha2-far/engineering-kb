  - id: frontend/xss/unsanitized-html-sink
    title: Ne pas ecrire de variable dans un puits HTML sans assainissement
    category: frontend
    subcategory: xss
    severity: high
    confidence: high
    description: >-
      Les points d'ecriture directe dans le DOM (innerHTML, dangerouslySetInnerHTML,
      v-html) ne doivent pas recevoir de valeur dynamique sans assainissement
      prealable par une bibliotheque dediee.
    rationale: >-
      Ces puits interpretent la chaine recue comme du balisage : une valeur
      contenant une balise ou un attribut de gestionnaire d'evenement s'execute dans
      la session de l'utilisateur, avec ses cookies et ses droits. Le rendu par
      defaut du framework echappe deja les valeurs ; ces API sont precisement les
      sorties de secours qui desactivent cette protection.
    remediation: >-
      Preferer textContent ou le rendu normal du framework, qui traitent la valeur
      comme du texte. Quand du HTML doit reellement etre rendu, le passer par un
      assainisseur avec liste d'autorisation avant l'affectation.
    context:
      languages: [typescript, javascript]
      frameworks: [react, next, vue, svelte]
      project_types: [saas, static-site, ai-rag]
    detection:
      - kind: grep
        pattern: 'dangerouslySetInnerHTML|\.innerHTML\s*=|\.outerHTML\s*=|v-html|\{@html'
        applies_to: ['**/*.tsx', '**/*.jsx', '**/*.ts', '**/*.js', '**/*.vue', '**/*.svelte']
        note: >-
          Puits HTML. Verifier qu'un assainisseur intervient sur la valeur ecrite.
      - kind: grep
        pattern: '(?i)document\.write\s*\(|\.insertAdjacentHTML\s*\('
        applies_to: ['**/*.ts', '**/*.js', '**/*.tsx']
    autofix: review
    vulnerable_example:
      lang: typescript
      code: |
        elem.innerHTML = commentaire;    // commentaire vient de l'utilisateur
      explanation: >-
        Un commentaire contenant une balise img avec onerror execute du script.
    fixed_example:
      lang: typescript
      code: |
        // Si le texte suffit :
        elem.textContent = commentaire;

        // Si du HTML est vraiment necessaire :
        elem.innerHTML = DOMPurify.sanitize(commentaire);
      explanation: >-
        textContent n'interprete rien ; DOMPurify ne laisse passer qu'une liste de
        balises et d'attributs sans effet actif.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.md
        doc_sha256: d297fa71c9d35ac4a9cd951a65b84d85ef029166e34948851cd3a3f16f7db89c
        anchor: Framework Security
        url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        quote: |-
          developers need to know that problems can occur if frameworks are used insecurely, such as:

          - _escape hatches_ that frameworks use to directly manipulate the DOM
          - React’s `dangerouslySetInnerHTML` without sanitising the HTML
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.md
        doc_sha256: d297fa71c9d35ac4a9cd951a65b84d85ef029166e34948851cd3a3f16f7db89c
        anchor: Safe Sinks
        url: https://cheatsheetseries.owasp.org/cheatsheets/Cross_Site_Scripting_Prevention_Cheat_Sheet.html
        quote: |-
          Try to refactor your code to remove references to unsafe sinks like innerHTML, and instead use textContent or value.
    tags: [xss, frontend, dom, react]
    cwe: ['CWE-79']
    owasp: ['A03:2021']
