  - id: app-security/logging/secrets-written-to-logs
    title: Exclure secrets et donnees sensibles des journaux
    category: app-security
    subcategory: logging
    severity: high
    confidence: high
    description: >-
      Les journaux ne doivent contenir ni mot de passe, ni jeton d'acces, ni
      identifiant de session, ni chaine de connexion, ni cle de chiffrement, ni
      donnee personnelle sensible : ces valeurs sont retirees, masquees ou hachees
      avant ecriture.
    rationale: >-
      Un journal circule bien plus largement que la base : il est agrege, expedie
      vers un service tiers, conserve longtemps et lu par des personnes qui n'ont
      pas acces a la production. Un secret qui y apparait est donc diffuse au-dela
      de tout controle, et sa rotation devient obligatoire des qu'on s'en apercoit.
      Pour un cabinet, la meme logique vaut pour la donnee client.
    remediation: >-
      Poser un filtre de redaction dans la configuration de journalisation plutot
      que de compter sur la vigilance a chaque appel, ne jamais journaliser un objet
      de requete entier, et verifier les traces d'exception qui embarquent souvent
      les parametres.
    context:
      languages: [python, typescript]
      project_types: [saas, api, ai-rag, pipeline, cli]
    detection:
      - kind: grep
        pattern: '(?i)(logger|log|console)\.(debug|info|warn|warning|error)\s*\([^)]{0,120}\b(password|passwd|secret|token|api_key|apikey|authorization|credential|connection_string)\b'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
      - kind: grep
        pattern: '(?i)(logger|log|console)\.(debug|info|warn|warning|error)\s*\(\s*[^)]{0,40}\b(request|req|payload|body|headers|event)\s*\)'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: >-
          Objet de requete journalise en entier : en-tete Authorization inclus.
    autofix: review
    vulnerable_example:
      lang: python
      code: |
        logger.info("connexion", extra={"email": email, "password": mot_de_passe})
      explanation: >-
        Le mot de passe part vers l'agregateur de journaux et y reste.
    fixed_example:
      lang: python
      code: |
        logger.info("connexion", extra={"email": email})   # jamais le secret

        # Et un filtre pose une fois pour toutes, plutot que la vigilance a chaque appel :
        class RedactionFilter(logging.Filter):
            CHAMPS = {"password", "token", "authorization", "api_key"}

            def filter(self, record):
                for champ in self.CHAMPS & set(vars(record)):
                    setattr(record, champ, "[redige]")
                return True
      explanation: >-
        La redaction ne depend plus de la relecture de chaque appel a logger.
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Logging_Cheat_Sheet.md
        doc_sha256: 342a2e9161f004a4aebe217da8476344e1b117f579f6252969e3b9054253eca7
        anchor: Data to exclude
        url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
        quote: |-
          The following should usually not be recorded directly in the logs, but instead should be removed, masked, sanitized, hashed, or encrypted:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Logging_Cheat_Sheet.md
        doc_sha256: 342a2e9161f004a4aebe217da8476344e1b117f579f6252969e3b9054253eca7
        anchor: Data to exclude
        url: https://cheatsheetseries.owasp.org/cheatsheets/Logging_Cheat_Sheet.html
        quote: |-
          - Authentication passwords
          - Database connection strings
          - Encryption keys and other primary secrets
    tags: [journalisation, secrets, pii, observabilite]
