  - id: app-security/error-handling/stack-trace-returned-to-client
    title: Renvoyer une reponse d'erreur generique et journaliser le detail cote serveur
    category: app-security
    subcategory: error-handling
    severity: medium
    confidence: high
    description: >-
      Une erreur inattendue doit produire une reponse generique pour l'appelant,
      tandis que la trace complete est journalisee cote serveur. Aucun message
      d'exception, chemin de fichier, requete SQL ni version de composant ne doit
      figurer dans la reponse.
    rationale: >-
      Une trace d'exception renseigne l'attaquant sur la pile, l'arborescence, le
      schema de base et les points ou l'entree n'est pas geree : elle transforme une
      erreur en cartographie gratuite du systeme. La meme information est utile a
      l'equipe, mais dans les journaux, ou son acces est controle.
    remediation: >-
      Installer un gestionnaire d'erreurs global qui retourne un corps neutre avec un
      identifiant de correlation, et journaliser l'exception complete avec ce meme
      identifiant. Verifier que le mode debug est desactive en production.
    context:
      languages: [python, typescript]
      frameworks: [fastapi, next, express]
      project_types: [saas, api, ai-rag, static-site]
    detection:
      - kind: grep
        pattern: '(?i)(debug\s*=\s*True|DEBUG\s*[:=]\s*(true|1)\b)'
        applies_to: ['**/*.py', '**/*.ts', '**/*.env*', '**/settings*.py', '**/config*.py']
        note: "Mode debug actif : les traces partent au client."
      - kind: grep
        pattern: '(?i)(JSONResponse|jsonify|res\.(json|send)|HTTPException)\s*\([^)]{0,120}(str\s*\(\s*e\s*\)|traceback\.|\.stack\b|repr\s*\(\s*e)'
        applies_to: ['**/*.py', '**/*.ts', '**/*.js']
        note: Detail d'exception renvoye dans la reponse.
    autofix: review
    evidence:
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Error_Handling_Cheat_Sheet.md
        doc_sha256: 97a57eb94a0355cf7e74646c1026ad60296e75eb076fe9fc365db4884d5f3691
        anchor: Objective
        url: https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
        quote: |-
          when an unexpected error occurs then a generic response is returned by the application but the error details are logged server side for investigation, and not returned to the user.
      - source_id: owasp-cheatsheets
        doc_path: owasp-cheatsheets/cheatsheets/Error_Handling_Cheat_Sheet.md
        doc_sha256: 97a57eb94a0355cf7e74646c1026ad60296e75eb076fe9fc365db4884d5f3691
        anchor: HTTP return codes
        url: https://cheatsheetseries.owasp.org/cheatsheets/Error_Handling_Cheat_Sheet.html
        quote: |-
          Using error messages that do not provide implementation details is important to avoid information leakage.
